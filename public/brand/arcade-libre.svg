<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d7a" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Icono Gamer Arcade -->
  <g transform="translate(10, 10)">
    <!-- Marco Hexagonal / Escudo -->
    <rect x="0" y="0" width="60" height="60" rx="18" fill="url(#brand-grad)" opacity="0.2" stroke="url(#brand-grad)" stroke-width="2" />
    
    <!-- D-Pad / Botones Neón -->
    <path d="M 22 25 L 22 35 M 17 30 L 27 30" stroke="#ff4d7a" stroke-width="3.5" stroke-linecap="round" filter="url(#neon-glow)" />
    <circle cx="39" cy="27" r="3" fill="#ff4d7a" filter="url(#neon-glow)" />
    <circle cx="45" cy="33" r="3" fill="#7c3aed" filter="url(#neon-glow)" />
    
    <!-- Rayo de Energía Central -->
    <path d="M 30 18 L 26 28 L 32 28 L 28 42 L 35 30 L 29 30 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Tipografía ARCADE LIBRE -->
  <text x="82" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="1">
    ARCADE
  </text>
  <text x="180" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="url(#brand-grad)" letter-spacing="2">
    LIBRE
  </text>
  
  <text x="84" y="55" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#b7a3ad" letter-spacing="3" text-transform="uppercase">
    ZONA GAMER SIN LÍMITES
  </text>
</svg>
