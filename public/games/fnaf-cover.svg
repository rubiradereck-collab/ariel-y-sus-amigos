<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bgFnaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24070a"/>
      <stop offset="60%" stop-color="#120406"/>
      <stop offset="100%" stop-color="#050102"/>
    </linearGradient>
    <filter id="glowFnaf" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bgFnaf)"/>

  <!-- Monitor de Vigilancia con Ojos Rojos -->
  <g transform="translate(320, 195)" filter="url(#glowFnaf)">
    <!-- Marco de cámara -->
    <rect x="-140" y="-85" width="280" height="170" rx="16" fill="#080203" stroke="rgba(239,68,68,0.4)" stroke-width="3"/>
    
    <!-- Líneas de scanline -->
    <line x1="-135" y1="-40" x2="135" y2="-40" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="-135" y1="0" x2="135" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="-135" y1="40" x2="135" y2="40" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Ojos Animatrónicos Rojos en la Oscuridad -->
    <circle cx="-50" cy="-10" r="16" fill="#ef4444"/>
    <circle cx="-50" cy="-10" r="7" fill="#ffffff"/>
    <circle cx="50" cy="-10" r="16" fill="#ef4444"/>
    <circle cx="50" cy="-10" r="7" fill="#ffffff"/>

    <!-- Sonrisa siniestra en sombras -->
    <path d="M -40 35 Q 0 65 40 35" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>

    <!-- REC indicador -->
    <circle cx="-110" cy="-60" r="6" fill="#ef4444" className="animate-pulse"/>
    <text x="-95" y="-55" font-family="monospace" font-size="12" font-weight="900" fill="#ef4444">CAM 01</text>
    <text x="75" y="-55" font-family="monospace" font-size="12" font-weight="900" fill="#ef4444">12 AM</text>
  </g>

  <!-- Tag -->
  <g transform="translate(40, 50)">
    <rect width="130" height="34" rx="17" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="65" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#f87171" text-anchor="middle" letter-spacing="1">SURVIVAL</text>
  </g>
</svg>
