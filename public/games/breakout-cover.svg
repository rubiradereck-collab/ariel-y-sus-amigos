<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bgBreak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140316"/>
      <stop offset="50%" stop-color="#280c25"/>
      <stop offset="100%" stop-color="#0b020c"/>
    </linearGradient>
    <filter id="glowBreak" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bgBreak)"/>
  
  <!-- Ladrillos neón en la parte superior -->
  <g filter="url(#glowBreak)">
    <!-- Fila 1 Rosa -->
    <rect x="70" y="45" width="85" height="24" rx="6" fill="#ff4d7a"/>
    <rect x="165" y="45" width="85" height="24" rx="6" fill="#ff4d7a"/>
    <rect x="260" y="45" width="85" height="24" rx="6" fill="#ff4d7a"/>
    <rect x="355" y="45" width="85" height="24" rx="6" fill="#ff4d7a"/>
    <rect x="450" y="45" width="85" height="24" rx="6" fill="#ff4d7a"/>

    <!-- Fila 2 Violeta -->
    <rect x="70" y="77" width="85" height="24" rx="6" fill="#c084fc"/>
    <rect x="165" y="77" width="85" height="24" rx="6" fill="#c084fc"/>
    <rect x="355" y="77" width="85" height="24" rx="6" fill="#c084fc"/>
    <rect x="450" y="77" width="85" height="24" rx="6" fill="#c084fc"/>

    <!-- Fila 3 Cian -->
    <rect x="70" y="109" width="85" height="24" rx="6" fill="#38bdf8"/>
    <rect x="260" y="109" width="85" height="24" rx="6" fill="#38bdf8"/>
    <rect x="450" y="109" width="85" height="24" rx="6" fill="#38bdf8"/>
  </g>

  <!-- Partículas de impacto -->
  <circle cx="260" cy="80" r="4" fill="#ff4d7a" filter="url(#glowBreak)"/>
  <circle cx="275" cy="72" r="3" fill="#fef08a" filter="url(#glowBreak)"/>
  <circle cx="250" cy="90" r="5" fill="#c084fc" filter="url(#glowBreak)"/>

  <!-- Bola láser -->
  <circle cx="270" cy="180" r="14" fill="#ffffff" filter="url(#glowBreak)"/>
  <circle cx="270" cy="180" r="10" fill="#38bdf8"/>

  <!-- Pala Neón en la parte inferior -->
  <g transform="translate(210, 330)" filter="url(#glowBreak)">
    <rect x="0" y="0" width="180" height="22" rx="11" fill="url(#bgBreak)" stroke="#ff4d7a" stroke-width="3"/>
    <rect x="8" y="4" width="164" height="14" rx="7" fill="#ff4d7a"/>
  </g>
</svg>
