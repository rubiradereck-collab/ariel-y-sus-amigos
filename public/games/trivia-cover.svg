<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bgTrivia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141126"/>
      <stop offset="60%" stop-color="#0c0a1a"/>
      <stop offset="100%" stop-color="#04030a"/>
    </linearGradient>
    <linearGradient id="goldTrivia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glowTrivia" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bgTrivia)"/>

  <!-- Trofeo Central y Cerebro -->
  <g transform="translate(320, 190)" filter="url(#glowTrivia)">
    <!-- Aura de luz -->
    <circle cx="0" cy="0" r="85" fill="rgba(245,158,11,0.12)"/>
    <!-- Trofeo Estilizado -->
    <path d="M -45 -50 L 45 -50 L 35 15 C 28 45 -28 45 -35 15 Z" fill="url(#goldTrivia)"/>
    <!-- Asas del Trofeo -->
    <path d="M -45 -35 C -75 -35 -75 0 -40 5" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
    <path d="M 45 -35 C 75 -35 75 0 40 5" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
    <!-- Pie del Trofeo -->
    <path d="M -15 35 L 15 35 L 20 60 L -20 60 Z" fill="#b45309"/>
    <rect x="-35" y="60" width="70" height="15" rx="5" fill="#f59e0b"/>
    <!-- Estrella frontal -->
    <path d="M 0 -22 L 5 -10 L 17 -10 L 8 -2 L 11 10 L 0 3 L -11 10 L -8 -2 L -17 -10 L -5 -10 Z" fill="#fff"/>
  </g>

  <!-- Tarjetas de Pregunta en perspectiva -->
  <g transform="translate(110, 160)" opacity="0.6">
    <rect width="100" height="70" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(251,191,36,0.3)" stroke-width="1.5"/>
    <text x="50" y="44" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#fbbf24" text-anchor="middle">?</text>
  </g>

  <g transform="translate(430, 160)" opacity="0.6">
    <rect width="100" height="70" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
    <text x="50" y="44" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#38bdf8" text-anchor="middle">XP</text>
  </g>

  <!-- Tag -->
  <g transform="translate(40, 50)">
    <rect width="120" height="34" rx="17" fill="rgba(245,158,11,0.15)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="60" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="1">QUIZ MASTER</text>
  </g>
</svg>
