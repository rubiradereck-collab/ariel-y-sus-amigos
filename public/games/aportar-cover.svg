<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bgAportar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a152e"/>
      <stop offset="60%" stop-color="#070c1a"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <filter id="glowAportar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bgAportar)"/>

  <!-- Icono de Base de Datos y Pluma en Cian/Azul PS5 -->
  <g transform="translate(320, 195)" filter="url(#glowAportar)">
    <!-- Cilindro BD 1 -->
    <ellipse cx="0" cy="-45" rx="75" ry="22" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/>
    <path d="M -75 -45 L -75 0 A 75 22 0 0 0 75 0 L 75 -45 Z" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
    <!-- Cilindro BD 2 -->
    <path d="M -75 0 L -75 45 A 75 22 0 0 0 75 45 L 75 0 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>

    <!-- Lápiz / Símbolo de Añadir -->
    <circle cx="55" cy="45" r="28" fill="#2563eb" stroke="#93c5fd" stroke-width="3"/>
    <text x="55" y="55" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#fff" text-anchor="middle">+</text>
  </g>

  <!-- Tag -->
  <g transform="translate(40, 50)">
    <rect width="130" height="34" rx="17" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="65" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#60a5fa" text-anchor="middle" letter-spacing="1">COMMUNITY BD</text>
  </g>
</svg>
