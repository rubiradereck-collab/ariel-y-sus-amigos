<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sudoku Neón</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at 50% 15%, #1d0718, #0a030a 85%);
      color: #f5eef2;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .header {
      text-align: center;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #ff4d7a, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 600;
    }
    .btn {
      background: rgba(255, 77, 122, 0.15);
      border: 1px solid rgba(255, 77, 122, 0.4);
      color: #ff8aa6;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(255, 77, 122, 0.3);
      color: #fff;
    }
    .select-diff {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f5eef2;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12px;
      outline: none;
    }
    .board-container {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1;
      background: #110410;
      border: 3px solid rgba(255, 77, 122, 0.5);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 77, 122, 0.2);
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: background 0.15s, color 0.15s;
    }
    .cell:nth-child(3n) {
      border-right: 2px solid rgba(255, 77, 122, 0.4);
    }
    .cell:nth-child(9n) {
      border-right: none;
    }
    .cell.border-b-box {
      border-bottom: 2px solid rgba(255, 77, 122, 0.4);
    }
    .cell.fixed {
      color: #ffffff;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.03);
    }
    .cell.user {
      color: #c084fc;
    }
    .cell.selected {
      background: rgba(255, 77, 122, 0.3) !important;
      box-shadow: inset 0 0 10px rgba(255, 77, 122, 0.5);
    }
    .cell.highlight-same {
      background: rgba(192, 132, 252, 0.18);
    }
    .cell.highlight-peer {
      background: rgba(255, 255, 255, 0.04);
    }
    .cell.error {
      background: rgba(239, 68, 68, 0.35) !important;
      color: #fca5a5 !important;
      animation: shake 0.3s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(9, 1fr) 1.2fr;
      gap: 6px;
      width: 100%;
      max-width: 420px;
    }
    .key-btn {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #f5eef2;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .key-btn:hover {
      background: rgba(255, 77, 122, 0.25);
      border-color: #ff4d7a;
      transform: translateY(-2px);
    }
    .key-btn.erase {
      font-size: 12px;
      aspect-ratio: auto;
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .key-btn.erase:hover {
      background: rgba(239, 68, 68, 0.3);
    }
    .win-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 3, 10, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>SUDOKU NEÓN</h1>
  </div>

  <div class="top-bar">
    <div class="badge">⏱️ <span id="timerText">00:00</span></div>
    <div class="badge">❌ Errores: <span id="errorCount">0</span>/3</div>
    <select id="diffSelect" class="select-diff">
      <option value="easy">Fácil</option>
      <option value="medium">Medio</option>
      <option value="hard">Difícil</option>
    </select>
    <button class="btn" id="newGameBtn">Nuevo</button>
  </div>

  <div class="board-container" id="board"></div>

  <div class="keypad">
    <button class="key-btn" data-key="1">1</button>
    <button class="key-btn" data-key="2">2</button>
    <button class="key-btn" data-key="3">3</button>
    <button class="key-btn" data-key="4">4</button>
    <button class="key-btn" data-key="5">5</button>
    <button class="key-btn" data-key="6">6</button>
    <button class="key-btn" data-key="7">7</button>
    <button class="key-btn" data-key="8">8</button>
    <button class="key-btn" data-key="9">9</button>
    <button class="key-btn erase" data-key="0">Borrar</button>
  </div>

  <div class="win-overlay" id="winOverlay">
    <h2 style="font-size:32px; color:#ff4d7a;">🎉 ¡FELICITACIONES!</h2>
    <p style="color:#f5eef2; font-size:16px;">Has completado el Sudoku con éxito.</p>
    <p id="winStats" style="color:#c084fc; font-weight:600;"></p>
    <button class="btn" style="padding:10px 24px; font-size:14px; margin-top:10px;" onclick="startNewGame()">Jugar otra vez</button>
  </div>

  <script>
    // Tableros maestros con soluciones válidas y máscaras por dificultad
    const SOLVED_BASE = [
      [5,3,4,6,7,8,9,1,2],
      [6,7,2,1,9,5,3,4,8],
      [1,9,8,3,4,2,5,6,7],
      [8,5,9,7,6,1,4,2,3],
      [4,2,6,8,5,3,7,9,1],
      [7,1,3,9,2,4,8,5,6],
      [9,6,1,5,3,7,2,8,4],
      [2,8,7,4,1,9,6,3,5],
      [3,4,5,2,8,6,1,7,9]
    ];

    let currentSolution = [];
    let initialBoard = [];
    let userBoard = [];
    let selectedCell = null; // { r, c }
    let mistakes = 0;
    let timerSeconds = 0;
    let timerInterval = null;

    const audioCtx = (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined')
      ? new (window.AudioContext || window.webkitAudioContext)() : null;

    function playSound(type) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'tap') {
          osc.frequency.setValueAtTime(400, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.06);
        } else if (type === 'err') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.setValueAtTime(120, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'win') {
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.setValueAtTime(659, now + 0.12);
          osc.frequency.setValueAtTime(784, now + 0.24);
          osc.frequency.setValueAtTime(1046, now + 0.36);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        }
      } catch (e) {}
    }

    function shufflePermutations() {
      // Generar solución válida permutando números 1-9
      const map = {};
      const nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
      for (let i = 1; i <= 9; i++) map[i] = nums[i-1];

      currentSolution = SOLVED_BASE.map(row => row.map(v => map[v]));
    }

    function generateGame(difficulty) {
      shufflePermutations();
      let clues = 45; // easy
      if (difficulty === 'medium') clues = 34;
      if (difficulty === 'hard') clues = 26;

      initialBoard = currentSolution.map(row => [...row]);
      let cellsToRemove = 81 - clues;
      while (cellsToRemove > 0) {
        const r = Math.floor(Math.random() * 9);
        const c = Math.floor(Math.random() * 9);
        if (initialBoard[r][c] !== 0) {
          initialBoard[r][c] = 0;
          cellsToRemove--;
        }
      }
      userBoard = initialBoard.map(row => [...row]);
    }

    const boardEl = document.getElementById('board');

    function renderBoard() {
      boardEl.innerHTML = '';
      const selectedVal = selectedCell ? userBoard[selectedCell.r][selectedCell.c] : null;

      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const cellEl = document.createElement('div');
          cellEl.className = 'cell';
          if (r === 2 || r === 5) cellEl.classList.add('border-b-box');

          const isFixed = initialBoard[r][c] !== 0;
          const val = userBoard[r][c];

          if (isFixed) cellEl.classList.add('fixed');
          else if (val !== 0) cellEl.classList.add('user');

          if (val !== 0) cellEl.textContent = val;

          // Selecciones e iluminaciones
          if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
            cellEl.classList.add('selected');
          } else if (selectedCell && (selectedCell.r === r || selectedCell.c === c || (Math.floor(selectedCell.r/3) === Math.floor(r/3) && Math.floor(selectedCell.c/3) === Math.floor(c/3)))) {
            cellEl.classList.add('highlight-peer');
          }

          if (selectedVal && val === selectedVal && val !== 0 && !(selectedCell && selectedCell.r === r && selectedCell.c === c)) {
            cellEl.classList.add('highlight-same');
          }

          // Error si es incorrecto respecto a la solución
          if (!isFixed && val !== 0 && val !== currentSolution[r][c]) {
            cellEl.classList.add('error');
          }

          cellEl.addEventListener('click', () => {
            selectedCell = { r, c };
            playSound('tap');
            renderBoard();
          });

          boardEl.appendChild(cellEl);
        }
      }
    }

    function inputNumber(num) {
      if (!selectedCell) return;
      const { r, c } = selectedCell;
      if (initialBoard[r][c] !== 0) return; // Fija

      if (num === 0) {
        userBoard[r][c] = 0;
        playSound('tap');
        renderBoard();
        return;
      }

      userBoard[r][c] = num;
      if (num !== currentSolution[r][c]) {
        mistakes++;
        document.getElementById('errorCount').textContent = mistakes;
        playSound('err');
        if (mistakes >= 3) {
          alert('¡3 errores cometidos! Puedes seguir intentándolo o reiniciar el tablero.');
        }
      } else {
        playSound('tap');
        checkWin();
      }
      renderBoard();
    }

    function checkWin() {
      let won = true;
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (userBoard[r][c] !== currentSolution[r][c]) {
            won = false;
            break;
          }
        }
      }
      if (won) {
        clearInterval(timerInterval);
        playSound('win');
        document.getElementById('winStats').textContent = `Tiempo: ${formatTime(timerSeconds)} | Errores: ${mistakes}`;
        document.getElementById('winOverlay').style.display = 'flex';
      }
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = (secs % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function startNewGame() {
      document.getElementById('winOverlay').style.display = 'none';
      const diff = document.getElementById('diffSelect').value;
      generateGame(diff);
      selectedCell = null;
      mistakes = 0;
      document.getElementById('errorCount').textContent = '0';
      timerSeconds = 0;
      document.getElementById('timerText').textContent = '00:00';
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timerSeconds++;
        document.getElementById('timerText').textContent = formatTime(timerSeconds);
      }, 1000);
      renderBoard();
    }

    document.querySelectorAll('.key-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = parseInt(btn.dataset.key, 10);
        inputNumber(key);
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '9') {
        inputNumber(parseInt(e.key, 10));
      } else if (e.key === 'Backspace' || e.key === 'Delete') {
        inputNumber(0);
      } else if (e.key === 'ArrowUp' && selectedCell && selectedCell.r > 0) {
        selectedCell.r--; renderBoard();
      } else if (e.key === 'ArrowDown' && selectedCell && selectedCell.r < 8) {
        selectedCell.r++; renderBoard();
      } else if (e.key === 'ArrowLeft' && selectedCell && selectedCell.c > 0) {
        selectedCell.c--; renderBoard();
      } else if (e.key === 'ArrowRight' && selectedCell && selectedCell.c < 8) {
        selectedCell.c++; renderBoard();
      }
    });

    document.getElementById('newGameBtn').addEventListener('click', startNewGame);
    document.getElementById('diffSelect').addEventListener('change', startNewGame);

    startNewGame();
  </script>
</body>
</html>
