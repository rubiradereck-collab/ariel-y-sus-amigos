<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg2048" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f071c"/>
      <stop offset="50%" stop-color="#2d0e26"/>
      <stop offset="100%" stop-color="#0e030e"/>
    </linearGradient>
    <linearGradient id="tileGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d7a"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="tileGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="gold2048" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow2048" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg2048)"/>
  
  <!-- Cuadrícula Neón -->
  <g opacity="0.12" stroke="#ff4d7a" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="128" y1="0" x2="128" y2="400"/>
    <line x1="256" y1="0" x2="256" y2="400"/>
    <line x1="384" y1="0" x2="384" y2="400"/>
    <line x1="512" y1="0" x2="512" y2="400"/>
  </g>

  <!-- Bloques flotantes -->
  <g transform="translate(140, 60)">
    <rect x="0" y="0" width="100" height="100" rx="16" fill="url(#tileGrad1)" filter="url(#glow2048)"/>
    <text x="50" y="62" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#fff" text-anchor="middle">512</text>
  </g>
  <g transform="translate(260, 60)">
    <rect x="0" y="0" width="100" height="100" rx="16" fill="url(#tileGrad2)" filter="url(#glow2048)"/>
    <text x="50" y="62" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#fff" text-anchor="middle">1024</text>
  </g>
  <g transform="translate(380, 60)">
    <rect x="0" y="0" width="100" height="100" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,77,122,0.4)" stroke-width="2"/>
    <text x="50" y="62" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ff8aa6" text-anchor="middle">256</text>
  </g>

  <!-- Gran Bloque 2048 Dorado -->
  <g transform="translate(200, 180)" filter="url(#glow2048)">
    <rect x="0" y="0" width="240" height="150" rx="24" fill="url(#gold2048)" stroke="#fef08a" stroke-width="3"/>
    <text x="120" y="98" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#422006" text-anchor="middle" letter-spacing="2">2048</text>
  </g>
</svg>
