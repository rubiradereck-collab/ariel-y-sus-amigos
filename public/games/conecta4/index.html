<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Conecta 4 Neón</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at 50% 20%, #200a1a, #0d040a 80%);
      color: #f5eef2;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #ff4d7a, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 440px;
    }
    .turn-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }
    .turn-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }
    .btn {
      background: rgba(255, 77, 122, 0.15);
      border: 1px solid rgba(255, 77, 122, 0.4);
      color: #ff8aa6;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(255, 77, 122, 0.3);
      color: #fff;
      transform: translateY(-1px);
    }
    .mode-select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f5eef2;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    .board-container {
      position: relative;
      background: linear-gradient(145deg, #180918, #0e050e);
      border: 2px solid rgba(255, 77, 122, 0.3);
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 77, 122, 0.15);
      max-width: 440px;
      width: 100%;
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .col-target {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px;
      border-radius: 12px;
      transition: background 0.15s ease;
    }
    .col-target:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .cell {
      aspect-ratio: 1;
      width: 100%;
      border-radius: 50%;
      background: #090308;
      border: 2px solid rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .cell.p1 {
      background: radial-gradient(circle at 35% 35%, #ff8aa6, #e8365d);
      border-color: #ff4d7a;
      box-shadow: 0 0 16px rgba(255, 77, 122, 0.7), inset 0 2px 4px rgba(255,255,255,0.4);
      animation: drop 0.25s cubic-bezier(0.2, 0.8, 0.3, 1.2);
    }
    .cell.p2 {
      background: radial-gradient(circle at 35% 35%, #60a5fa, #2563eb);
      border-color: #3b82f6;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.7), inset 0 2px 4px rgba(255,255,255,0.4);
      animation: drop 0.25s cubic-bezier(0.2, 0.8, 0.3, 1.2);
    }
    .cell.win {
      animation: pulseWin 0.8s infinite alternate !important;
      border-color: #facc15 !important;
      box-shadow: 0 0 24px #facc15, inset 0 0 10px #facc15 !important;
    }
    @keyframes drop {
      from { transform: translateY(-40px); opacity: 0.5; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes pulseWin {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.08); filter: brightness(1.35); }
    }
    .footer-scores {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 440px;
      margin-top: 14px;
      font-size: 13px;
    }
    .score-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .banner {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 700;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>CONECTA 4 NEÓN</h1>
  </div>

  <div class="status-bar">
    <div class="turn-pill">
      <div id="turnDot" class="turn-dot" style="background: #ff4d7a; color: #ff4d7a;"></div>
      <span id="turnText">Turno: Rosa (Tú)</span>
    </div>
    <select id="modeSelect" class="mode-select">
      <option value="pve">vs Robot CPU</option>
      <option value="pvp">2 Jugadores Local</option>
    </select>
    <button class="btn" id="restartBtn">Reiniciar</button>
  </div>

  <div class="board-container">
    <div id="board" class="board-grid"></div>
  </div>

  <div class="banner" id="banner"></div>

  <div class="footer-scores">
    <div class="score-badge" style="color: #ff8aa6">
      <span>● Rosa:</span> <span id="scoreP1">0</span>
    </div>
    <div class="score-badge" style="color: #60a5fa">
      <span>● Azul:</span> <span id="scoreP2">0</span>
    </div>
    <div class="score-badge" style="color: #a8a29e">
      <span>Empates:</span> <span id="scoreDraws">0</span>
    </div>
  </div>

  <script>
    const ROWS = 6;
    const COLS = 7;
    let grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
    let currentPlayer = 1; // 1 = Rosa, 2 = Azul
    let gameOver = false;
    let scores = { p1: 0, p2: 0, draws: 0 };
    let winCells = [];

    const audioCtx = (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined')
      ? new (window.AudioContext || window.webkitAudioContext)() : null;

    function playSound(type) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'drop') {
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'win') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554, now + 0.1);
          osc.frequency.setValueAtTime(659, now + 0.2);
          osc.frequency.setValueAtTime(880, now + 0.3);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
        }
      } catch (e) {}
    }

    const boardEl = document.getElementById('board');
    const turnDot = document.getElementById('turnDot');
    const turnText = document.getElementById('turnText');
    const banner = document.getElementById('banner');
    const modeSelect = document.getElementById('modeSelect');

    function renderBoard() {
      boardEl.innerHTML = '';
      for (let c = 0; c < COLS; c++) {
        const colEl = document.createElement('div');
        colEl.className = 'col-target';
        colEl.dataset.col = c;
        colEl.addEventListener('click', () => handleColumnClick(c));

        for (let r = 0; r < ROWS; r++) {
          const cellEl = document.createElement('div');
          cellEl.className = 'cell';
          const val = grid[r][c];
          if (val === 1) cellEl.classList.add('p1');
          if (val === 2) cellEl.classList.add('p2');

          const isWin = winCells.some(([wr, wc]) => wr === r && wc === c);
          if (isWin) cellEl.classList.add('win');

          colEl.appendChild(cellEl);
        }
        boardEl.appendChild(colEl);
      }
    }

    function updateStatus() {
      if (gameOver) return;
      const isP1 = currentPlayer === 1;
      turnDot.style.background = isP1 ? '#ff4d7a' : '#3b82f6';
      turnDot.style.color = isP1 ? '#ff4d7a' : '#3b82f6';
      if (modeSelect.value === 'pve') {
        turnText.textContent = isP1 ? 'Turno: Rosa (Tú)' : 'Turno: Azul (Robot CPU...)';
      } else {
        turnText.textContent = isP1 ? 'Turno: Rosa (J1)' : 'Turno: Azul (J2)';
      }
    }

    function checkWin(boardState, player) {
      // Horizontal
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c <= COLS - 4; c++) {
          if (boardState[r][c] === player &&
              boardState[r][c+1] === player &&
              boardState[r][c+2] === player &&
              boardState[r][c+3] === player) {
            return [[r,c], [r,c+1], [r,c+2], [r,c+3]];
          }
        }
      }
      // Vertical
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r <= ROWS - 4; r++) {
          if (boardState[r][c] === player &&
              boardState[r+1][c] === player &&
              boardState[r+2][c] === player &&
              boardState[r+3][c] === player) {
            return [[r,c], [r+1,c], [r+2,c], [r+3,c]];
          }
        }
      }
      // Diagonal descendente
      for (let r = 0; r <= ROWS - 4; r++) {
        for (let c = 0; c <= COLS - 4; c++) {
          if (boardState[r][c] === player &&
              boardState[r+1][c+1] === player &&
              boardState[r+2][c+2] === player &&
              boardState[r+3][c+3] === player) {
            return [[r,c], [r+1,c+1], [r+2,c+2], [r+3,c+3]];
          }
        }
      }
      // Diagonal ascendente
      for (let r = 3; r < ROWS; r++) {
        for (let c = 0; c <= COLS - 4; c++) {
          if (boardState[r][c] === player &&
              boardState[r-1][c+1] === player &&
              boardState[r-2][c+2] === player &&
              boardState[r-3][c+3] === player) {
            return [[r,c], [r-1,c+1], [r-2,c+2], [r-3,c+3]];
          }
        }
      }
      return null;
    }

    function isBoardFull() {
      return grid[0].every(cell => cell !== 0);
    }

    function dropInCol(col, player) {
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r][col] === 0) {
          grid[r][col] = player;
          return r;
        }
      }
      return -1;
    }

    function handleColumnClick(col) {
      if (gameOver) return;
      if (modeSelect.value === 'pve' && currentPlayer === 2) return;

      const row = dropInCol(col, currentPlayer);
      if (row === -1) return; // Columna llena

      playSound('drop');
      const win = checkWin(grid, currentPlayer);
      if (win) {
        winCells = win;
        gameOver = true;
        renderBoard();
        playSound('win');
        if (currentPlayer === 1) {
          scores.p1++;
          document.getElementById('scoreP1').textContent = scores.p1;
          banner.innerHTML = '<span style="color:#ff8aa6">🎉 ¡Gana Rosa!</span>';
        } else {
          scores.p2++;
          document.getElementById('scoreP2').textContent = scores.p2;
          banner.innerHTML = '<span style="color:#60a5fa">🎉 ¡Gana Azul!</span>';
        }
        return;
      }

      if (isBoardFull()) {
        gameOver = true;
        scores.draws++;
        document.getElementById('scoreDraws').textContent = scores.draws;
        banner.innerHTML = '<span style="color:#a8a29e">¡Empate! Tablero lleno</span>';
        renderBoard();
        return;
      }

      currentPlayer = currentPlayer === 1 ? 2 : 1;
      updateStatus();
      renderBoard();

      if (modeSelect.value === 'pve' && currentPlayer === 2) {
        setTimeout(botMove, 400);
      }
    }

    function botMove() {
      if (gameOver) return;
      // 1. ¿Puede ganar el bot en este turno?
      for (let c = 0; c < COLS; c++) {
        const testGrid = grid.map(r => [...r]);
        let r = -1;
        for (let row = ROWS - 1; row >= 0; row--) {
          if (testGrid[row][c] === 0) { testGrid[row][c] = 2; r = row; break; }
        }
        if (r !== -1 && checkWin(testGrid, 2)) {
          executeBotCol(c);
          return;
        }
      }
      // 2. ¿Debe bloquear al jugador?
      for (let c = 0; c < COLS; c++) {
        const testGrid = grid.map(r => [...r]);
        let r = -1;
        for (let row = ROWS - 1; row >= 0; row--) {
          if (testGrid[row][c] === 0) { testGrid[row][c] = 1; r = row; break; }
        }
        if (r !== -1 && checkWin(testGrid, 1)) {
          executeBotCol(c);
          return;
        }
      }
      // 3. Columna central preferente o aleatorio inteligente
      const order = [3, 2, 4, 1, 5, 0, 6];
      for (let c of order) {
        if (grid[0][c] === 0) {
          executeBotCol(c);
          return;
        }
      }
    }

    function executeBotCol(col) {
      const row = dropInCol(col, 2);
      if (row === -1) return;
      playSound('drop');
      const win = checkWin(grid, 2);
      if (win) {
        winCells = win;
        gameOver = true;
        renderBoard();
        playSound('win');
        scores.p2++;
        document.getElementById('scoreP2').textContent = scores.p2;
        banner.innerHTML = '<span style="color:#60a5fa">🤖 El robot ha ganado</span>';
        return;
      }
      if (isBoardFull()) {
        gameOver = true;
        scores.draws++;
        document.getElementById('scoreDraws').textContent = scores.draws;
        banner.innerHTML = '<span style="color:#a8a29e">¡Empate! Tablero lleno</span>';
        renderBoard();
        return;
      }
      currentPlayer = 1;
      updateStatus();
      renderBoard();
    }

    function restart() {
      grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
      currentPlayer = 1;
      gameOver = false;
      winCells = [];
      banner.textContent = '';
      updateStatus();
      renderBoard();
    }

    document.getElementById('restartBtn').addEventListener('click', restart);
    modeSelect.addEventListener('change', restart);

    restart();
  </script>
</body>
</html>
