<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bgPong" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140416"/>
      <stop offset="50%" stop-color="#260b24"/>
      <stop offset="100%" stop-color="#0a020b"/>
    </linearGradient>
    <filter id="glowPong" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bgPong)"/>
  
  <!-- Red central punteada -->
  <line x1="320" y1="20" x2="320" y2="380" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-dasharray="16, 12"/>

  <!-- Marcador Neón de Fondo -->
  <text x="240" y="100" font-family="system-ui, sans-serif" font-size="70" font-weight="900" fill="rgba(255,77,122,0.3)" text-anchor="middle">07</text>
  <text x="400" y="100" font-family="system-ui, sans-serif" font-size="70" font-weight="900" fill="rgba(56,189,248,0.3)" text-anchor="middle">09</text>

  <!-- Palas -->
  <!-- Pala Izquierda Rosa -->
  <rect x="70" y="120" width="18" height="130" rx="9" fill="#ff4d7a" filter="url(#glowPong)"/>
  <!-- Pala Derecha Cian -->
  <rect x="552" y="160" width="18" height="130" rx="9" fill="#38bdf8" filter="url(#glowPong)"/>

  <!-- Bola y Estela -->
  <!-- Estela -->
  <path d="M 120 220 Q 230 180 340 210" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="195" r="10" fill="rgba(255,77,122,0.4)" filter="url(#glowPong)"/>
  <circle cx="280" cy="200" r="14" fill="rgba(255,255,255,0.6)" filter="url(#glowPong)"/>
  <!-- Bola Neón -->
  <circle cx="350" cy="210" r="18" fill="#ffffff" filter="url(#glowPong)"/>
  <circle cx="350" cy="210" r="14" fill="#fef08a"/>
</svg>
