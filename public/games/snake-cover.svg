<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bgSnake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f17"/>
      <stop offset="60%" stop-color="#071410"/>
      <stop offset="100%" stop-color="#020806"/>
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glowSnake" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bgSnake)"/>

  <!-- Grid PS5 Mesh -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="128" y1="0" x2="128" y2="400"/>
    <line x1="256" y1="0" x2="256" y2="400"/>
    <line x1="384" y1="0" x2="384" y2="400"/>
    <line x1="512" y1="0" x2="512" y2="400"/>
  </g>

  <!-- Cuerpo de la Serpiente Neón -->
  <g filter="url(#glowSnake)">
    <!-- Rastro de la serpiente -->
    <path d="M 120 280 L 240 280 L 240 160 L 420 160 L 420 240 L 480 240" 
          fill="none" stroke="url(#snakeGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cabeza -->
    <circle cx="480" cy="240" r="18" fill="#6ee7b7"/>
    <!-- Ojo -->
    <circle cx="486" cy="235" r="4" fill="#042f2e"/>

    <!-- Manzana / Comida -->
    <circle cx="530" cy="180" r="14" fill="#f43f5e" filter="url(#glowSnake)"/>
    <circle cx="530" cy="180" r="8" fill="#fda4af"/>
  </g>

  <!-- Puntos & Récord Tag -->
  <g transform="translate(40, 50)">
    <rect width="130" height="34" rx="17" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
    <text x="65" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="1">RETRO CLASSIC</text>
  </g>
</svg>
