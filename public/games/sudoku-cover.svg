<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bgSudo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b061d"/>
      <stop offset="50%" stop-color="#260b26"/>
      <stop offset="100%" stop-color="#0a020b"/>
    </linearGradient>
    <filter id="glowSudo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bgSudo)"/>
  
  <!-- Cuadrícula 3x3 Neón destacada -->
  <g transform="translate(170, 50)" filter="url(#glowSudo)">
    <rect x="0" y="0" width="300" height="300" rx="20" fill="#130412" stroke="#ff4d7a" stroke-width="3"/>

    <!-- Líneas internas -->
    <line x1="100" y1="0" x2="100" y2="300" stroke="#ff4d7a" stroke-width="2"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="#ff4d7a" stroke-width="2"/>
    <line x1="0" y1="100" x2="300" y2="100" stroke="#ff4d7a" stroke-width="2"/>
    <line x1="0" y1="200" x2="300" y2="200" stroke="#ff4d7a" stroke-width="2"/>

    <!-- Números Neón -->
    <text x="50" y="68" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#ff8aa6" text-anchor="middle">5</text>
    <text x="150" y="68" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#38bdf8" text-anchor="middle">3</text>
    <text x="250" y="68" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#c084fc" text-anchor="middle">7</text>

    <text x="50" y="168" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#c084fc" text-anchor="middle">6</text>
    <rect x="110" y="110" width="80" height="80" rx="12" fill="rgba(255,77,122,0.25)"/>
    <text x="150" y="168" font-family="system-ui, sans-serif" font-size="56" font-weight="900" fill="#fef08a" text-anchor="middle">9</text>
    <text x="250" y="168" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#38bdf8" text-anchor="middle">1</text>

    <text x="50" y="268" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#38bdf8" text-anchor="middle">8</text>
    <text x="150" y="268" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#c084fc" text-anchor="middle">4</text>
    <text x="250" y="268" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#ff8aa6" text-anchor="middle">2</text>
  </g>
</svg>
