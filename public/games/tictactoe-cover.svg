<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bgTtt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="60%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>
    <filter id="glowTtt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bgTtt)"/>

  <!-- Cuadrícula 3x3 -->
  <g stroke="rgba(56,189,248,0.25)" stroke-width="4" stroke-linecap="round">
    <line x1="260" y1="70" x2="260" y2="330"/>
    <line x1="380" y1="70" x2="380" y2="330"/>
    <line x1="160" y1="150" x2="480" y2="150"/>
    <line x1="160" y1="250" x2="480" y2="250"/>
  </g>

  <!-- Fichas X en Cian PS5 -->
  <g stroke="#38bdf8" stroke-width="12" stroke-linecap="round" filter="url(#glowTtt)">
    <!-- X superior izquierda -->
    <line x1="185" y1="85" x2="235" y2="135"/>
    <line x1="235" y1="85" x2="185" y2="135"/>
    <!-- X central -->
    <line x1="295" y1="175" x2="345" y2="225"/>
    <line x1="345" y1="175" x2="295" y2="225"/>
    <!-- X inferior derecha -->
    <line x1="405" y1="265" x2="455" y2="315"/>
    <line x1="455" y1="265" x2="405" y2="315"/>
  </g>

  <!-- Línea de Victoria Diagonal -->
  <line x1="180" y1="80" x2="460" y2="320" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" filter="url(#glowTtt)"/>

  <!-- Fichas O en Violeta/Rosa PS5 -->
  <g filter="url(#glowTtt)">
    <circle cx="430" cy="110" r="28" fill="none" stroke="#a855f7" stroke-width="10"/>
    <circle cx="210" cy="290" r="28" fill="none" stroke="#a855f7" stroke-width="10"/>
  </g>

  <!-- Tag 1v1 -->
  <g transform="translate(40, 50)">
    <rect width="110" height="34" rx="17" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="55" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">1V1 ONLINE</text>
  </g>
</svg>
